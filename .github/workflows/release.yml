name: Release

# Push a tag like v1.0.0 to build the dmg and publish it as a GitHub Release.
# The tag must match the VERSION file and point at a commit that is on main.
# The build job runs the repository's scripts and has no write access. Only the publish job can create the
# release, and it waits for a reviewer when the "release" environment requires one (see docs/releasing.md).
# For a notarized build, add the secrets described in docs/releasing.md; without them the dmg is ad-hoc signed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      # Only a yes or no is shared with every step, never the secret itself.
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches the VERSION file and sits on main
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d '[:space:]' < VERSION)"
          [ "$want" = "$have" ] || { echo "tag $want but VERSION says $have"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Check the structure
        run: ./scripts/check-structure.sh
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          xcrun notarytool store-credentials tbpk-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=tbpk-notary" >> "$GITHUB_ENV"
      - name: Build
        run: ./build.sh
      - name: Show the dmg hash for signing
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shasum -a 256 "dist/TBPK-$VERSION.dmg" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/TBPK-*.dmg
            dist/TBPK-*.dmg.sha256
            dist/notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "TBPK-$VERSION.dmg" "TBPK-$VERSION.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
